[package]
name = "dappercode-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/DavidParks8/DapperCode"
publish = false

[workspace.dependencies]
agent-client-protocol = { version = "1.2.0", features = ["unstable_elicitation", "unstable_end_turn_token_usage"] }
axum = { version = "0.8", features = ["ws", "http1", "tokio", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
dappercode-bridge-core = { path = "crates/core" }
dappercode-bridge-path-policy = { path = "crates/path-policy" }
dappercode-bridge-platform = { path = "crates/platform" }
futures-util = "0.3"
getrandom = "0.3"
libc = "0.2"
qr2term = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.1.4", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
rustix = { version = "1.1", features = ["fs"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = "1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-stream = "0.1"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
boxed_slice_into_iter = "deny"
dependency_on_unit_never_type_fallback = "deny"
deprecated_safe_2024 = "deny"
edition_2024_expr_fragment_specifier = "deny"
if_let_rescope = "deny"
impl_trait_overcaptures = "deny"
invalid_reference_casting = "forbid"
invalid_value = "forbid"
keyword_idents_2024 = "deny"
missing_unsafe_on_extern = "deny"
never_type_fallback_flowing_into_unsafe = "deny"
rust_2024_guarded_string_incompatible_syntax = "deny"
rust_2024_incompatible_pat = "deny"
rust_2024_prelude_collisions = "deny"
static_mut_refs = "deny"
non_ascii_idents = "forbid"
trivial_numeric_casts = "deny"
unsafe_attr_outside_unsafe = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_must_use = "deny"
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_ptr_cast_mut = "deny"
borrow_as_ptr = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_ptr_alignment = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
coerce_container_to_any = "deny"
collection_is_never_read = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
default_union_representation = "deny"
empty_drop = "deny"
fallible_impl_from = "deny"
exit = "deny"
float_arithmetic = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
ignore_without_reason = "deny"
imprecise_flops = "deny"
invalid_upcast_comparisons = "deny"
large_futures = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
lossy_float_literal = "deny"
manual_midpoint = "deny"
mem_forget = "deny"
mixed_read_write_in_expression = "deny"
missing_fields_in_debug = "deny"
multiple_unsafe_ops_per_block = "deny"
mut_from_ref = "forbid"
negative_feature_names = "deny"
no_mangle_with_rust_abi = "deny"
non_send_fields_in_send_ty = "deny"
panic = "deny"
panic_in_result_fn = "deny"
path_buf_push_overwrite = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
rc_mutex = "deny"
read_zero_byte_vec = "deny"
ref_as_ptr = "deny"
same_functions_in_if_condition = "deny"
should_panic_without_expect = "deny"
significant_drop_in_scrutinee = "deny"
suspicious_operation_groupings = "deny"
suspicious_xor_used_as_pow = "deny"
todo = "deny"
trailing_empty_array = "deny"
transmute_ptr_to_ptr = "deny"
transmute_undefined_repr = "deny"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
uninhabited_references = "deny"
uninit_assumed_init = "forbid"
uninit_vec = "forbid"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unsafe_derive_deserialize = "deny"
unsound_collection_transmute = "forbid"
unused_peekable = "deny"
unused_result_ok = "deny"
unused_rounding = "deny"
unwrap_used = "deny"
volatile_composites = "deny"
while_float = "deny"
wildcard_dependencies = "deny"

[features]
e2e-agent = []

[[bin]]
name = "dappercode-e2e-agent"
path = "src/e2e_agent.rs"
required-features = ["e2e-agent"]

[lints]
workspace = true

[dependencies]
agent-client-protocol.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
dappercode-bridge-core.workspace = true
dappercode-bridge-path-policy.workspace = true
dappercode-bridge-platform.workspace = true
futures-util.workspace = true
getrandom.workspace = true
qr2term.workspace = true
regex.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
dappercode-bridge-path-policy = { workspace = true, features = ["test-support"] }
dappercode-bridge-platform = { workspace = true, features = ["test-support"] }
