[package]
name = "dappercode-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/DavidParks8/DapperCode"
publish = false

[workspace.dependencies]
agent-client-protocol = { version = "1.2.0", features = ["unstable_elicitation", "unstable_end_turn_token_usage"] }
axum = { version = "0.8", features = ["ws", "http1", "tokio", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
dappercode-bridge-core = { path = "crates/core" }
dappercode-bridge-path-policy = { path = "crates/path-policy" }
dappercode-bridge-platform = { path = "crates/platform" }
futures = "0.3"
futures-util = "0.3"
getrandom = "0.3"
libc = "0.2"
qr2term = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.1.4", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
rustix = { version = "1.1", features = ["fs"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = "1"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[features]
e2e-agent = []

[[bin]]
name = "dappercode-e2e-agent"
path = "src/e2e_agent.rs"
required-features = ["e2e-agent"]

[lints]
workspace = true

[dependencies]
agent-client-protocol.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
dappercode-bridge-core.workspace = true
dappercode-bridge-path-policy.workspace = true
dappercode-bridge-platform.workspace = true
futures.workspace = true
futures-util.workspace = true
getrandom.workspace = true
qr2term.workspace = true
regex.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
dappercode-bridge-path-policy = { workspace = true, features = ["test-support"] }
dappercode-bridge-platform = { workspace = true, features = ["test-support"] }
