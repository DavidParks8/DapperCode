name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      windows_signing_mode:
        description: Windows package signing mode
        required: true
        default: Test
        type: choice
        options:
          - Test
          - Production

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.22.2'
  RUST_VERSION: '1.97.1'
  DOTNET_VERSION: '10.0.302'
  NUGET_VERSION: '6.14.0'

jobs:
  repository-policy:
    name: Repository Policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository policy
        run: |
          pnpm run docs:check
          pnpm run payment:check
          pnpm run format:check
          pnpm run test:scripts
          pnpm run security:check
          pnpm run duplicates:native

  rpc-contract:
    name: RPC Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/rust-bridge -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate RPC contract
        run: pnpm run contract:check

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @dappercode/mobile run lint

      - name: Check source duplication
        run: pnpm run duplicates:mobile

      - name: Typecheck
        run: pnpm --filter @dappercode/mobile run typecheck

      - name: Test with branch coverage
        run: pnpm --filter @dappercode/mobile run test:coverage

      - name: Build Expo export
        run: pnpm --filter @dappercode/mobile run build

      - name: Upload mobile coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: apps/mobile/coverage
          if-no-files-found: warn

      - name: Upload Expo export
        uses: actions/upload-artifact@v4
        with:
          name: mobile-expo-export
          path: apps/mobile/dist

  mobile-e2e:
    name: Mobile E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/rust-bridge -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck e2e suite
        run: pnpm run typecheck:e2e

      # Dependency installation does not fetch browser binaries, and the suite pins a Chromium
      # revision, so this installs the matching build rather than relying on a system browser.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run layout e2e suite
        run: pnpm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .e2e/runs
          if-no-files-found: ignore

  rust-bridge:
    name: Rust Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/rust-bridge -> target
            apps/desktop -> target

      - name: Check formatting
        working-directory: services/rust-bridge
        run: cargo fmt --all --check

      - name: Check all targets
        working-directory: services/rust-bridge
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Lint all targets
        working-directory: services/rust-bridge
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Lint desktop on Linux
        run: cargo clippy --locked --workspace --all-targets --all-features --manifest-path apps/desktop/Cargo.toml -- -D warnings

      - name: Lint release desktop on Linux
        run: cargo clippy --locked --release --workspace --all-features --lib --bins --manifest-path apps/desktop/Cargo.toml -- -D warnings

      - name: Run Rust tests
        working-directory: services/rust-bridge
        run: cargo test --locked --workspace --all-targets --all-features -- --test-threads=1

  desktop-macos:
    name: Desktop macOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt

      - name: Cache desktop Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop -> target
            services/rust-bridge -> target

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint Swift sources
        run: pnpm run swift:lint

      - name: Check formatting
        working-directory: apps/desktop
        run: cargo fmt --all --check

      - name: Check desktop
        run: pnpm run desktop:check

      - name: Lint desktop
        working-directory: apps/desktop
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Lint bridge on macOS
        run: cargo clippy --locked --workspace --all-targets --all-features --manifest-path services/rust-bridge/Cargo.toml -- -D warnings

      - name: Lint release desktop on macOS
        run: cargo clippy --locked --release --workspace --all-features --lib --bins --manifest-path apps/desktop/Cargo.toml -- -D warnings

      - name: Test desktop
        run: pnpm run desktop:test

      - name: Build macOS app
        run: pnpm run desktop:build:macos

      - name: Verify native bundle policy
        run: |
          APP="apps/desktop/dist/DapperCode.app"
          test -x "$APP/Contents/MacOS/DapperCode"
          test -x "$APP/Contents/Resources/bin/dappercode"
          test -x "$APP/Contents/Resources/bin/dappercode-bridge"
          ! find "$APP" -type f \( -name '*.js' -o -name package.json -o -name package-lock.json -o -name pnpm-lock.yaml -o -name node -o -name npm -o -name npx -o -name pnpm -o -name pnpx \) -print | grep .
          ! find "$APP" -type f -print0 | xargs -0 strings | grep -Ei 'slint|node_modules|DAPPERCODE_BRIDGE_BINARY|DAPPERCODE_PACKAGE_ROOT|vendor/bridge-binaries|services/rust-bridge/target'
          codesign --verify --deep --strict "$APP"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: dappercode-desktop-macos-${{ runner.arch }}
          path: apps/desktop/dist/DapperCode-*.zip
          if-no-files-found: error

  desktop-windows-validate:
    name: Desktop Windows Validation
    if: inputs.windows_signing_mode != 'Production' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DAPPERCODE_WINDOWS_SIGNING_MODE: ${{ inputs.windows_signing_mode || 'Test' }}
      DAPPERCODE_WINDOWS_PACKAGE_IDENTITY: ${{ vars.WINDOWS_PACKAGE_IDENTITY }}
      DAPPERCODE_WINDOWS_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup pinned NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: ${{ env.NUGET_VERSION }}

      - name: Cache WinUI NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: >-
            nuget-${{ runner.os }}-${{
              hashFiles('global.json', 'apps/desktop/windows/Directory.Packages.props',
              'apps/desktop/windows/**/*.csproj')
            }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Setup Rust with Windows targets
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt

      - name: Cache desktop Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop -> target
            services/rust-bridge -> target

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore pinned WinUI dependencies
        shell: pwsh
        run: ./scripts/restore-desktop-windows.ps1 -ExpectedSdkVersion "${{ env.DOTNET_VERSION }}"

      - name: Test all WinUI suites
        shell: pwsh
        run: ./scripts/test-desktop-windows-dotnet.ps1

      - name: Check Windows desktop source policy
        shell: pwsh
        run: ./scripts/test-desktop-windows.ps1 -SourceOnly

      - name: Check Rust formatting
        run: |
          cargo fmt --all --check --manifest-path apps/desktop/Cargo.toml
          cargo fmt --all --check --manifest-path services/rust-bridge/Cargo.toml

      - name: Check and lint Windows Rust
        run: |
          cargo check --locked --workspace --all-targets --manifest-path apps/desktop/Cargo.toml
          cargo clippy --locked --workspace --all-targets --all-features --manifest-path apps/desktop/Cargo.toml -- -D warnings
          cargo clippy --locked --release --workspace --all-features --lib --bins --manifest-path apps/desktop/Cargo.toml -- -D warnings
          cargo check --locked --workspace --all-targets --all-features --manifest-path services/rust-bridge/Cargo.toml
          cargo clippy --locked --workspace --all-targets --all-features --manifest-path services/rust-bridge/Cargo.toml -- -D warnings

      - name: Test Windows Rust
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: ./scripts/test-rust-windows.ps1

  desktop-windows-package:
    name: Desktop Windows Package (${{ matrix.architecture }})
    if: inputs.windows_signing_mode != 'Production' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            rust-target: x86_64-pc-windows-msvc
          - architecture: arm64
            rust-target: aarch64-pc-windows-msvc
    env:
      DAPPERCODE_WINDOWS_SIGNING_MODE: ${{ inputs.windows_signing_mode || 'Test' }}
      DAPPERCODE_WINDOWS_PACKAGE_IDENTITY: ${{ vars.WINDOWS_PACKAGE_IDENTITY }}
      DAPPERCODE_WINDOWS_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache WinUI NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: >-
            nuget-${{ runner.os }}-${{
              hashFiles('global.json', 'apps/desktop/windows/Directory.Packages.props',
              'apps/desktop/windows/**/*.csproj')
            }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Setup architecture Rust target
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache architecture Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop -> target
            services/rust-bridge -> target
          shared-key: windows-${{ matrix.architecture }}-release

      - name: Build unsigned architecture package
        shell: pwsh
        run: >-
          ./scripts/build-desktop-windows.ps1
          -Architecture ${{ matrix.architecture }}
          -SkipBundle
          -SkipInspection

      - name: Upload unsigned architecture package
        uses: actions/upload-artifact@v4
        with:
          name: dappercode-desktop-windows-${{ matrix.architecture }}-package
          path: apps/desktop/dist/windows/packages/*.msix
          if-no-files-found: error
          retention-days: 1

  desktop-windows:
    name: Desktop Windows
    if: inputs.windows_signing_mode != 'Production' || github.ref == 'refs/heads/main'
    needs:
      - desktop-windows-validate
      - desktop-windows-package
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DAPPERCODE_WINDOWS_SIGNING_MODE: ${{ inputs.windows_signing_mode || 'Test' }}
      DAPPERCODE_WINDOWS_PACKAGE_IDENTITY: ${{ vars.WINDOWS_PACKAGE_IDENTITY }}
      DAPPERCODE_WINDOWS_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download unsigned architecture packages
        uses: actions/download-artifact@v4
        with:
          pattern: dappercode-desktop-windows-*-package
          path: apps/desktop/dist/windows/packages
          merge-multiple: true

      - name: Bundle, sign, and inspect architecture packages
        shell: pwsh
        run: >-
          ./scripts/build-desktop-windows.ps1
          -Operation Bundle
          -SigningMode ${{ env.DAPPERCODE_WINDOWS_SIGNING_MODE }}

      - name: Upload test-signed Windows bundle and public certificate
        if: env.DAPPERCODE_WINDOWS_SIGNING_MODE == 'Test'
        uses: actions/upload-artifact@v4
        with:
          name: dappercode-desktop-windows-x64-arm64
          path: |
            apps/desktop/dist/windows/*.msixbundle
            apps/desktop/dist/windows/DapperCode-Signing.cer
            apps/desktop/dist/windows/INSTALL-WINDOWS.txt
          if-no-files-found: error

      - name: Upload inspected unsigned production packages
        if: env.DAPPERCODE_WINDOWS_SIGNING_MODE == 'Production'
        uses: actions/upload-artifact@v4
        with:
          name: dappercode-desktop-windows-unsigned-production
          path: |
            apps/desktop/dist/windows/*.msixbundle
            apps/desktop/dist/windows/packages/*.msix
          if-no-files-found: error
          retention-days: 1

      - name: Upload reviewed production signing script
        if: env.DAPPERCODE_WINDOWS_SIGNING_MODE == 'Production'
        uses: actions/upload-artifact@v4
        with:
          name: dappercode-desktop-windows-production-signing-script
          path: scripts/sign-desktop-windows-production.ps1
          if-no-files-found: error
          retention-days: 1

  desktop-windows-production-sign:
    name: Desktop Windows Production Signing
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.windows_signing_mode == 'Production' &&
      github.ref == 'refs/heads/main'
    needs: desktop-windows
    runs-on: windows-latest
    timeout-minutes: 15
    environment: windows-production-signing
    permissions:
      actions: read
      contents: none
    steps:
      - name: Download inspected unsigned production packages
        uses: actions/download-artifact@v4
        with:
          name: dappercode-desktop-windows-unsigned-production
          path: windows-production

      - name: Download reviewed production signing script
        uses: actions/download-artifact@v4
        with:
          name: dappercode-desktop-windows-production-signing-script
          path: windows-signing-script

      - name: Sign and verify production packages
        shell: pwsh
        env:
          DAPPERCODE_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          DAPPERCODE_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          DAPPERCODE_WINDOWS_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          DAPPERCODE_WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: >-
          ./windows-signing-script/sign-desktop-windows-production.ps1
          -ArtifactRoot ./windows-production

      - name: Upload signed production bundle
        uses: actions/upload-artifact@v4
        with:
          name: dappercode-desktop-windows-x64-arm64
          path: windows-production
          if-no-files-found: error

  rust-coverage:
    name: Rust Branch Coverage
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pinned nightly Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-07-15
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.83.4
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none

      - name: Cache Rust coverage dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/rust-bridge -> target
            apps/desktop -> target
          key: llvm-cov-branch-nightly-2026-07-15-v2
          cache-bin: false
          cache-on-failure: true

      - name: Enforce Rust branch coverage
        run: pnpm run coverage:rust

      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-branch-coverage-macos
          path: |
            services/rust-bridge/target/llvm-cov/coverage.json
            services/rust-bridge/target/llvm-cov/html
            apps/desktop/target/llvm-cov/coverage.json
            apps/desktop/target/llvm-cov/html
          if-no-files-found: warn

  rust-dylint:
    name: Rust Dylint (${{ matrix.os_label }})
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_label: Linux
            target: x86_64-unknown-linux-gnu
            cargo_dylint_sha256: 11a75eb2b0f57a7240a08deb95898cf7b54d5d57e0a08f8328e4ce6b6263ef4f
            dylint_link_sha256: 06cf85d33132e54daef748a6b9a98939a8f8e4119cafd27c675e56c7c7a86a38
          - os: macos-26
            os_label: macOS
            target: aarch64-apple-darwin
            cargo_dylint_sha256: a85d12f7c9b3ff943cbb76012a0510711fce0a3847332cee5885c957139cb46d
            dylint_link_sha256: b9a767942f58137c291a6181750d18e7a74db0784a46d093882dfa077c9478f3
          - os: windows-latest
            os_label: Windows
            target: x86_64-pc-windows-msvc
            cargo_dylint_sha256: 859ee7d262cf25f9fe5b2da6e6af5897d54b8a1e26cf38a1806493189f3d483d
            dylint_link_sha256: c00e983739e4dc7151a83d0047a4d40e44d460f61f9c2575733b2cc63582c412
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Setup perfectionist nightly toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-07-09
          components: llvm-tools-preview,rustc-dev,rust-src

      - name: Cache dylint drivers and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.dylint_drivers
            services/rust-bridge/target/dylint
            apps/desktop/target/dylint
          key: >-
            rust-dylint-v1-${{ runner.os }}-${{ hashFiles('services/rust-bridge/dylint.toml',
            'apps/desktop/dylint.toml') }}

      - name: Install pinned cargo-dylint and dylint-link
        shell: bash
        env:
          DYLINT_VERSION: '6.4.0'
          DYLINT_TARGET: ${{ matrix.target }}
          CARGO_DYLINT_SHA256: ${{ matrix.cargo_dylint_sha256 }}
          DYLINT_LINK_SHA256: ${{ matrix.dylint_link_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/bin"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          verify_sha256() {
            local file="$1"
            local expected="$2"
            local actual
            if command -v sha256sum >/dev/null 2>&1; then
              actual="$(sha256sum "$file" | awk '{print $1}')"
            else
              actual="$(shasum -a 256 "$file" | awk '{print $1}')"
            fi
            if [ "$actual" != "$expected" ]; then
              echo "SHA-256 mismatch for $file: expected $expected, got $actual" >&2
              exit 1
            fi
          }
          for entry in "cargo-dylint:$CARGO_DYLINT_SHA256" "dylint-link:$DYLINT_LINK_SHA256"; do
            name="${entry%%:*}"
            expected="${entry#*:}"
            archive="$tmpdir/${name}-${DYLINT_TARGET}-v${DYLINT_VERSION}.tar.gz"
            curl -fsSL "https://github.com/trailofbits/dylint/releases/download/v${DYLINT_VERSION}/${name}-${DYLINT_TARGET}-v${DYLINT_VERSION}.tar.gz" -o "$archive"
            verify_sha256 "$archive" "$expected"
            tar -xzf "$archive" --strip-components=1 -C "$HOME/.cargo/bin"
          done
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          PATH="$HOME/.cargo/bin:$PATH"
          cargo dylint --version
          command -v dylint-link

      - name: Run perfectionist Dylint rules
        run: node ./scripts/run-dylint.mjs
