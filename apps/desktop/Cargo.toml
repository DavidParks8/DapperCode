[package]
name = "dappercode-desktop"
version = "0.1.0"
edition = "2021"
description = "Native desktop control surface for the DapperCode bridge"
license = "MIT"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[[bin]]
name = "dappercode"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
fs2 = "0.4.3"
getrandom = "0.3"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
ureq = { version = "3.3.0", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3.23"
