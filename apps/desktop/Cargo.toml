[package]
name = "dappercode-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native desktop control surface for the DapperCode bridge"
license.workspace = true
publish.workspace = true

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "http1", "tokio"] }
dappercode-broker = { path = "crates/broker" }
dappercode-desktop-core = { path = "crates/core" }
futures-util = "0.3"
getrandom = "0.3"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.23"
tokio = "1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.3.0", default-features = false, features = ["json"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
boxed_slice_into_iter = "deny"
dependency_on_unit_never_type_fallback = "deny"
deprecated_safe_2024 = "deny"
edition_2024_expr_fragment_specifier = "deny"
if_let_rescope = "deny"
impl_trait_overcaptures = "deny"
invalid_reference_casting = "forbid"
invalid_value = "forbid"
keyword_idents_2024 = "deny"
missing_unsafe_on_extern = "deny"
never_type_fallback_flowing_into_unsafe = "deny"
rust_2024_guarded_string_incompatible_syntax = "deny"
rust_2024_incompatible_pat = "deny"
rust_2024_prelude_collisions = "deny"
static_mut_refs = "deny"
non_ascii_idents = "forbid"
trivial_numeric_casts = "deny"
unsafe_attr_outside_unsafe = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_must_use = "deny"
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_ptr_cast_mut = "deny"
borrow_as_ptr = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_ptr_alignment = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
coerce_container_to_any = "deny"
collection_is_never_read = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
default_union_representation = "deny"
empty_drop = "deny"
fallible_impl_from = "deny"
exit = "deny"
float_arithmetic = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
ignore_without_reason = "deny"
imprecise_flops = "deny"
invalid_upcast_comparisons = "deny"
large_futures = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
lossy_float_literal = "deny"
manual_midpoint = "deny"
mem_forget = "deny"
mixed_read_write_in_expression = "deny"
missing_fields_in_debug = "deny"
multiple_unsafe_ops_per_block = "deny"
mut_from_ref = "forbid"
negative_feature_names = "deny"
no_mangle_with_rust_abi = "deny"
non_send_fields_in_send_ty = "deny"
panic = "deny"
panic_in_result_fn = "deny"
path_buf_push_overwrite = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
rc_mutex = "deny"
read_zero_byte_vec = "deny"
ref_as_ptr = "deny"
same_functions_in_if_condition = "deny"
should_panic_without_expect = "deny"
significant_drop_in_scrutinee = "deny"
suspicious_operation_groupings = "deny"
suspicious_xor_used_as_pow = "deny"
todo = "deny"
trailing_empty_array = "deny"
transmute_ptr_to_ptr = "deny"
transmute_undefined_repr = "deny"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
uninhabited_references = "deny"
uninit_assumed_init = "forbid"
uninit_vec = "forbid"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unsafe_derive_deserialize = "deny"
unsound_collection_transmute = "forbid"
unused_peekable = "deny"
unused_result_ok = "deny"
unused_rounding = "deny"
unwrap_used = "deny"
volatile_composites = "deny"
while_float = "deny"
wildcard_dependencies = "deny"

[lints]
workspace = true

[[bin]]
name = "dappercode"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dappercode-broker.workspace = true
dappercode-desktop-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
dappercode-desktop-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
